overrides:
    # @crxjs/vite-plugin pins rollup 2.79.2 exactly (GHSA-mw96-cpmx-2vgc); 2.80.0 is the patch release of the same line.
    'rollup@<2.80.0': '^2.80.0'

# Supply-chain guard: only install versions published at least 14 days ago (in minutes).
# The 2026 npm worms (Shai-Hulud and its variants) were caught and pulled within days, so
# a fresh release is the one most likely to be a hijacked one.
minimumReleaseAge: 20160
