<!doctype html>
<html lang="en" style="color-scheme: dark light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="appName"></title>
        <link rel="icon" type="image/png" href="../../../../assets/icons/icon48.png" />
        <script src="../../../utils/theme-init.js"></script>
        <script src="../../../utils/i18n-init.js"></script>
        <style>
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                background-color: #f5f5f5;
            }
            @media (prefers-color-scheme: dark) {
                html,
                body {
                    background-color: #000000;
                }
            }
            html[data-theme='dark'],
            html[data-theme='dark'] body {
                background-color: #000000;
            }
            html[data-theme='light'],
            html[data-theme='light'] body {
                background-color: #f5f5f5;
            }
            html[data-theme='viridian'],
            html[data-theme='viridian'] body {
                background-color: #1b2631;
            }
            html[data-theme='custom'],
            html[data-theme='custom'] body {
                background-color: var(--bg-color);
            }
            body {
                background-color: var(--bg-color);
            }
        </style>
        <script type="module" src="./main.js"></script>
    </head>
    <body></body>
</html>
