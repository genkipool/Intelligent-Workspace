<!doctype html>
<html lang="en" style="color-scheme: dark light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="savedThemes"></title>
        <link rel="icon" type="image/png" href="../../../../assets/icons/icon48.png" />
        <style>
            /* Prevents white flash by setting a default background based on system preference or saved theme */
            html {
                background-color: #f5f5f5;
            }
            @media (prefers-color-scheme: dark) {
                html {
                    background-color: #000000;
                }
            }
            html[data-theme='dark'] {
                background-color: #000000;
            }
            html[data-theme='light'] {
                background-color: #f5f5f5;
            }
            html[data-theme='viridian'] {
                background-color: #1b2631;
            }
        </style>
        <script src="../../../utils/theme-init.js"></script>
        <link
            rel="preload"
            href="../../../../assets/fonts/Roboto-Flex-Regular.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <link rel="stylesheet" href="../../../styles/fonts.css" />
        <link rel="stylesheet" href="../../../styles/themes.css" />
        <link rel="stylesheet" href="savedThemes.css" />
    </head>
    <body>
        <script type="module" src="savedThemes.js"></script>
    </body>
</html>
