<!doctype html>
<html lang="en" style="color-scheme: dark light">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title data-i18n="aboutApp"></title>
        <link rel="icon" type="image/svg+xml" href="../../../../assets/icons/logo.svg" />
        <link rel="alternate icon" type="image/png" href="../../../../assets/icons/icon48.png" />
        <script src="../../../utils/theme-init.js"></script>
        <style>
            :root {
                --base-font-size: clamp(4px, 0.833vw, 56px);
                --header-height: clamp(15px, 3.125vw, 210px);
                --content-max-width: clamp(240px, 50vw, 3360px);
                --header-spacer-width: clamp(10px, 2.083vw, 140px);
                --app-logo-size: clamp(25px, 5.208vw, 350px);
                --team-photo-size: clamp(30px, 6.25vw, 420px);
                --features-grid-min-col: clamp(70px, 14.583vw, 980px);
                --notification-max-width: clamp(75px, 15.625vw, 1050px);
                --spacing-xs: clamp(1px, 0.208vw, 14px);
                --spacing-sm: clamp(2px, 0.417vw, 28px);
                --spacing-md: clamp(4px, 0.833vw, 56px);
                --spacing-lg: clamp(6px, 1.25vw, 84px);
                --spacing-xl: clamp(8px, 1.667vw, 112px);
                --notification-padding-y: clamp(3px, 0.625vw, 42px);
                --notification-padding-x: clamp(5px, 1.042vw, 70px);
                --h1-size: clamp(7.2px, 1.5vw, 100.8px);
                --h2-size: clamp(6px, 1.25vw, 84px);
                --h3-size: clamp(5px, 1.042vw, 70px);
                --h4-size: clamp(4.4px, 0.917vw, 61.6px);
                --back-button-icon-size: clamp(6px, 1.25vw, 84px);
                --tagline-font-size: clamp(3.8px, 0.792vw, 53.2px);
                --small-font-size: clamp(3.6px, 0.75vw, 50.4px);
                --xsmall-font-size: clamp(3.4px, 0.708vw, 47.6px);
                --notification-font-size: clamp(3.5px, 0.729vw, 49px);
                --feature-icon-width: clamp(7.2px, 1.5vw, 100.8px);
                --border-radius-sm: clamp(1.5px, 0.313vw, 21px);
                --border-radius-md: clamp(2.5px, 0.521vw, 35px);
                --thin-border: clamp(0.25px, 0.052vw, 3.5px);
                --medium-border: clamp(0.5px, 0.104vw, 7px);
                --card-shadow-offset-y: clamp(1px, 0.208vw, 14px);
                --card-shadow-blur: clamp(3.75px, 0.781vw, 52.5px);
                --hover-shadow-offset-y: clamp(1.5px, 0.313vw, 21px);
                --hover-shadow-blur: clamp(5px, 1.042vw, 70px);
                --focus-shadow-spread: clamp(0.5px, 0.104vw, 7px);
                --transition-duration: 0.3s;
                --size-height-github-link-wrapper: clamp(50px, 2.3vw, 155px);
                --contribution-icon-size: clamp(10px, 3.33vw, 220px);
                --small-spacing: clamp(6px, 0.42vw, 24px);
            }
            html,
            body {
                margin: 0;
                padding: 0;
                height: 100%;
                width: 100%;
                background-color: #f5f5f5;
            }
            @media (prefers-color-scheme: dark) {
                html,
                body {
                    background-color: #000000;
                }
            }
            html[data-theme='dark'],
            html[data-theme='dark'] body {
                background-color: #000000;
            }
            html[data-theme='light'],
            html[data-theme='light'] body {
                background-color: #f5f5f5;
            }
            html[data-theme='viridian'],
            html[data-theme='viridian'] body {
                background-color: #1b2631;
            }
            html[data-theme='custom'],
            html[data-theme='custom'] body {
                background-color: var(--bg-color);
            }
            body {
                background-color: var(--bg-color);
            }
            @media (max-width: 768px) {
                :root {
                    --h1-size: 1.8rem;
                    --h2-size: 1.5rem;
                    --h3-size: 1.3rem;
                    --h4-size: 1.15rem;
                    --base-font-size: 1rem;
                    --small-font-size: 0.9rem;
                    --xsmall-font-size: 0.8rem;
                    --tagline-font-size: 0.95rem;
                    --back-button-icon-size: 1.7rem;
                    --feature-icon-width: 2.5rem;
                    --spacing-md: 15px;
                    --spacing-xs: 5px;
                }
            }
            @media (max-width: 600px) {
                :root {
                    --h1-size: 1.6rem;
                }
            }
            @media (max-width: 420px) {
                :root {
                    --h1-size: 1.1rem;
                }
            }
        </style>
        <script type="module" src="./main.js"></script>
    </head>
    <body></body>
</html>
