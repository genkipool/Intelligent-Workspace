<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="color-scheme" content="light dark" />
        <title>Omnibar</title>
        <style>
            :root {
                color-scheme: light dark;
            }
            html,
            body {
                margin: 0;
                background: transparent !important;
                overflow: hidden;
            }
            /* On the page the bar inherited whatever font the site had; here there is no
               site, and the default would be a serif. It is an extension page, so it
               wears the extension's face like every other one. */
            body {
                font-family: var(--sans);
            }
        </style>
        <link rel="stylesheet" href="../../styles/fonts.css" />
    </head>
    <body>
        <script src="../languages.js"></script>
        <script src="../hint_common.js"></script>
        <script src="utils.js"></script>
        <script src="omnibar.js"></script>
        <script src="omnibar-frame.js"></script>
    </body>
</html>
