<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Apple Pay">
  <title>Apple Pay</title>
  <!-- Apple Pay Payment Mark, drawn to Apple's proportions in a single flat colour on
       white, which is the only treatment Apple's Human Interface Guidelines permit for
       the mark. It is never recoloured, outlined or set on a busy background.

       NOTE FOR WHOEVER PUBLISHES THIS: using the Apple Pay mark requires accepting
       Apple's Payment Mark licence in the developer account that ships the app. The
       payment BUTTON itself is drawn by Stripe from Apple's own assets and is compliant
       on its own; this file is only the tile icon. -->
  <rect width="512" height="512" rx="96" fill="#FFFFFF"/>
  <rect x="10" y="10" width="492" height="492" rx="88" fill="none" stroke="#DADCE0" stroke-width="20"/>
